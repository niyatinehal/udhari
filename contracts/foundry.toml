[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
# Paris keeps the bytecode free of PUSH0/MCOPY so the same build runs on Fuji and Hedera.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@chainlink/contracts-ccip/=node_modules/@chainlink/contracts-ccip/",
  "@chainlink/contracts/=node_modules/@chainlink/contracts/",
  "@openzeppelin/contracts@5.3.0/=node_modules/@openzeppelin/contracts-5.3.0/",
  "@openzeppelin/contracts@5.0.2/=node_modules/@openzeppelin/contracts-5.0.2/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[rpc_endpoints]
fuji = "${FUJI_RPC_URL}"
hedera = "${HEDERA_RPC_URL}"

[fmt]
line_length = 110
